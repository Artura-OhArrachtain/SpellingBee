<!doctype html>
<html>
<head>
  <base target="_top">
  <style>
    body { padding: 14px; color: #22251f; font: 13px/1.5 Arial, sans-serif; }
    p { color: #77796f; }
    textarea { box-sizing: border-box; width: 100%; min-height: 145px; padding: 9px; border: 1px solid #dedfd7; border-radius: 6px; font: inherit; }
    button { margin: 8px 6px 0 0; padding: 9px 12px; border: 0; border-radius: 6px; background: #365d45; color: white; cursor: pointer; }
    button.secondary { border: 1px solid #cfd9cb; background: #edf2ea; color: #294b37; }
    #status { min-height: 20px; color: #5f725d; }
  </style>
</head>
<body>
  <h2>SpellingBee</h2>
  <p>Select a passage in the document, then click the button below. SpellingBee will apply and highlight suggested corrections directly in the document.</p>
  <button id="check" type="button" onclick="checkSelectedText()">Mark corrections</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script>
    function checkSelectedText() {
      document.getElementById('check').disabled = true;
      document.getElementById('status').textContent = 'Checking and marking your writing…';
      google.script.run.withSuccessHandler(function (message) {
        document.getElementById('check').disabled = false;
        document.getElementById('status').textContent = message;
      }).withFailureHandler(function (error) {
        document.getElementById('check').disabled = false;
        showError(error);
      }).checkAndMarkSelection();
    }
    function showError(error) {
      document.getElementById('status').textContent = error.message || 'Something went wrong.';
    }
  </script>
</body>
</html>
